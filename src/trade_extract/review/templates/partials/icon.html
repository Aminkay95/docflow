{% macro icon(name, size=16, class_name='') -%}
<svg class="icon{{ ' ' ~ class_name if class_name else '' }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#lucide-{{ name }}"></use></svg>
{%- endmacro %}
