<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="login-visual-title login-visual-desc">
  <title id="login-visual-title">Trade documents traced through review</title>
  <desc id="login-visual-desc">Layered invoice and bill of lading sheets linked by provenance lines above a simplified port with cranes and containers.</desc>
  <defs>
    <pattern id="login-dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#D8DFE8"/>
