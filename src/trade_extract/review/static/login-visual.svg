      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="login-shadow" x="-20%" y="-20%" width="140%" height="150%">
