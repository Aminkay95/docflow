    </filter>
    <linearGradient id="login-grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.74" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="login-grid-fade-mask">
      <rect width="900" height="1200" fill="url(#login-grid-fade)"/>
    </mask>
  </defs>

