[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-extract"
version = "0.1.0"
description = "Provenance-first asynchronous trade-document extraction API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.13",
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mypy>=1.10",
    "pypdf>=4.2",
    "pytest>=8.2",
    "pytest-cov>=5",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "ruff>=0.5",
]
s3 = ["boto3>=1.34"]
conditioning = ["numpy>=1.26", "opencv-python-headless>=4.9"]
ocr = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "paddleocr[doc-parser]==3.3.2",
    "paddlepaddle==3.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trade_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a live PostgreSQL 16 database",
    "contract: verifies the generated OpenAPI and error envelopes",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".agents",
    ".bmad",
    ".bmad-loop",
    ".claude",
    "_bmad",
    "_bmad-output",
    "docs",
    "migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["trade_extract"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "boto3.*", "botocore.*", "paddleocr.*"]
ignore_missing_imports = true
