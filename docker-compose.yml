x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  # DATABASE_URL in .env is host-facing (localhost:5432/5434) and is consumed by
  # host-side tools such as alembic and pytest. Containers must use the compose
  # network name instead, because localhost inside a container is the container
  # itself. Override with DOCKER_DATABASE_URL when containers need another host.
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://trade:trade@postgres:5432/trade_extract}
  SECRET_KEY: ${SECRET_KEY:-development-only-secret}
  API_KEY_PEPPER: ${API_KEY_PEPPER:-development-only-pepper}
  STORAGE_BACKEND: filesystem
  STORAGE_DIR: /app/var/storage
  # Same reasoning as DATABASE_URL: .env carries the host-facing public base.
  BASE_URL: ${DOCKER_BASE_URL:-http://localhost:8000}
  # Password reset delivery. Resend takes precedence when RESEND_API_KEY is set.
  # Empty RESEND_API_KEY and SMTP_HOST writes .eml files to the outbox.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
  RESEND_TIMEOUT_SECONDS: ${RESEND_TIMEOUT_SECONDS:-10}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: "${SMTP_FROM:-Trade Extract <no-reply@localhost>}"
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  MAIL_OUTBOX_DIR: /app/var/outbox
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  PASSWORD_RESET_MIN_LENGTH: ${PASSWORD_RESET_MIN_LENGTH:-12}
  MAX_DOCUMENTS_PER_GROUP: ${MAX_DOCUMENTS_PER_GROUP:-20}
  MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
  MAX_PAGES_PER_FILE: ${MAX_PAGES_PER_FILE:-500}
  MAX_PAGES_PER_SUBMISSION: ${MAX_PAGES_PER_SUBMISSION:-2000}
  RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-2}
  TASK_STALE_AFTER_SECONDS: ${TASK_STALE_AFTER_SECONDS:-900}
  TASK_MAX_REQUEUES: ${TASK_MAX_REQUEUES:-3}
  TASK_BACKOFF_BASE_SECONDS: ${TASK_BACKOFF_BASE_SECONDS:-2}
  TASK_BACKOFF_MAX_SECONDS: ${TASK_BACKOFF_MAX_SECONDS:-300}
  WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
  WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
  WEBHOOK_CONNECT_TIMEOUT_SECONDS: ${WEBHOOK_CONNECT_TIMEOUT_SECONDS:-5}
  WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
  WEBHOOK_STALE_AFTER_SECONDS: ${WEBHOOK_STALE_AFTER_SECONDS:-900}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_POOL_MAX_OVERFLOW: ${DATABASE_POOL_MAX_OVERFLOW:-10}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
      POSTGRES_DB: trade_extract
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_extract"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["sh", "-c", "alembic upgrade head && python scripts/bootstrap.py"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *app-env
      # Polling makes watchfiles reliable with Docker Desktop bind mounts on Windows.
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
    command:
      [
        "uvicorn",
        "trade_extract.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/var/storage
      # Reset emails land here when SMTP_HOST is empty (local development).
      - ./var/outbox:/app/var/outbox
    develop:
      watch:
        # `docker compose up --watch` syncs source into the container; uvicorn
        # reloads Python, and Jinja/static files are read on each request.
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__/**"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "trade_extract.workers"]
    environment:
      <<: *app-env
      PROVIDER: ${PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-flash}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-v4-pro}
      PROVIDER_MAX_REPAIRS: ${PROVIDER_MAX_REPAIRS:-1}
      PROVIDER_MAX_OUTPUT_TOKENS: ${PROVIDER_MAX_OUTPUT_TOKENS:-8192}
      PROVIDER_MAX_EVIDENCE_CHARACTERS_PER_PAGE: ${PROVIDER_MAX_EVIDENCE_CHARACTERS_PER_PAGE:-24000}
      PROVIDER_MAX_ESTIMATED_INPUT_TOKENS_PER_PAGE: ${PROVIDER_MAX_ESTIMATED_INPUT_TOKENS_PER_PAGE:-12000}
      PROVIDER_MAX_CALLS_PER_PAGE: ${PROVIDER_MAX_CALLS_PER_PAGE:-40}
      PROVIDER_COST_TARGET_USD_PER_PAGE: ${PROVIDER_COST_TARGET_USD_PER_PAGE:-0.04}
      PROVIDER_COST_SAFETY_CEILING_USD_PER_PAGE: ${PROVIDER_COST_SAFETY_CEILING_USD_PER_PAGE:-0.12}
      OCR_DETECTION_MODEL: ${OCR_DETECTION_MODEL:-PP-OCRv5_mobile_det}
      OCR_RECOGNITION_MODEL: ${OCR_RECOGNITION_MODEL:-PP-OCRv5_mobile_rec}
      TABLE_WIRED_STRUCTURE_MODEL: ${TABLE_WIRED_STRUCTURE_MODEL:-SLANet_plus}
      TABLE_WIRELESS_STRUCTURE_MODEL: ${TABLE_WIRELESS_STRUCTURE_MODEL:-SLANet_plus}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-40000000}
      OCR_MAX_SPANS: ${OCR_MAX_SPANS:-10000}
      OCR_MAX_REGIONS: ${OCR_MAX_REGIONS:-100}
      OCR_MAX_ROWS: ${OCR_MAX_ROWS:-2000}
      OCR_MAX_CELLS: ${OCR_MAX_CELLS:-20000}
      OCR_MAX_HTML_BYTES: ${OCR_MAX_HTML_BYTES:-1000000}
    volumes:
      - storage:/app/var/storage
      - paddlex_cache:/home/appuser/.paddlex
    develop:
      watch:
        # Restart the worker when its code changes; in-flight tasks are requeued
        # by the stale-task sweeper.
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__/**"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"

  maintenance:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "trade_extract.workers.maintenance"]
    environment: *app-env
    volumes:
      - storage:/app/var/storage
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__/**"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
  paddlex_cache:
